name: .NET CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packs/**"
      - "assets/**"
      - "tools/**"
      - "tests/goldens/**"
      - "docs/port/**"
      - "global.json"
      - ".gitattributes"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "packs/**"
      - "assets/**"
      - "tools/**"
      - "tests/goldens/**"
      - "docs/port/**"
      - "global.json"
      - ".gitattributes"
      - ".github/workflows/dotnet-ci.yml"

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build src/RBX15.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test src/RBX15.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Ledger tool tests
        run: python -m unittest discover -s tools/ledger -p "test_*.py" -v

      - name: Ledger check
        run: python tools/ledger/ledger.py check

      - name: Upload test results and diff heatmaps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults
            **/diff-heatmaps/**
